syntax = "proto3";

option go_package = "telemetry/";
package rdss.telemetry.v1;

import "google/protobuf/timestamp.proto";


// Internal-only gRPC telemetry feed for a DMS engineer who works with the
// same client/substation UUIDs as the external REST/WS DMS API
// (app/routers/external_telemetry.py's `id` param) — never an RTU id or
// relay id, and protocol-agnostic: every device (RTU/IEC104, relay/IEC61850,
// Modbus) under that client or substation is included, normalised into the
// same point/type/value/quality/timestamp shape that API already uses (field
// names here are spelled out rather than mirroring that API's short JSON
// keys).
//
// Values come straight from the live in-memory poller caches
// (FledgeClientPool, RelayPollerPool) the instant a poll cycle refreshes
// them — never a re-read of any telemetry/live-value DB table. Container-
// to-container only (SCADA + DMS on the same host, same Docker network), but
// Subscribe still requires the same bearer token as the REST/WS API
// (fetched via POST /api/token), sent as gRPC metadata:
// authorization: Bearer <token>.

service TelemetryStream {
  rpc Subscribe(SubstationRequest) returns (stream SubstationUpdate);

  // Performs Supervisory Control for the specified tag.
  rpc SupervisoryControl(ScadaSupervisoryControlRequest) returns (ScadaSupervisoryControlResponse);

  // Sets a breaker's IEC 61850 Mod-style operating mode (On/Blocked/Test/
  // Off), controlling whether it accepts control commands and whether its
  // protection function drives real physical output.
  rpc ProtectionTerminalSetMode(ProtectionTerminalSetModeRequest) returns (ProtectionTerminalSetModeResponse);
}

message SubstationRequest {
  string id = 1;   // client OR substation UUID from the Hierarchy tree
}

enum DataPointType {
  UNKNOWN = 0;        // Unknown ???
  FLOAT = 1;          // Float analog
  INTEGER = 2;        // 2-bits DI
  BOOLEAN = 3;        // 1bit DI
  PROTECTION_EVENT = 4;
}

enum DataPointQuality {
  QDS_GOOD = 0;
  QDS_INVALID = 1;
  QDS_QUESTIONABLE = 2;
  QDS_SUBSTITUTED = 3;
  QDS_BLOCKED = 4;
  QDS_TEST = 5;
}

enum ScadaSupervisoryControlResult {
  OK = 0;
  ERROR_TIMEOUT = 1;
  ERROR_BLOCKED = 2;
  ERROR_UNKNOW = 3;
  ERROR_NOT_SUPPORTED = 4;
  ERROR_OBJECT_IS_NOT_FOUND = 5;
  ERROR_ITEM_IS_NOT_FOUND = 6;
  ERROR_NOT_SELECTED = 7;
}


message ScadaSupervisoryControlResponse {
  ScadaSupervisoryControlResult result = 1;
}

message DataPoint {
  // Point identifier
  string key = 1;
  // Point type
  DataPointType type = 2;
  // Point value
  float value = 3;
  // Quality status
  DataPointQuality quality = 4;
  // Point timestamp from RTU
  google.protobuf.Timestamp timestamp = 5;           // ISO 8601 timestamp with millisecond precision
}

message SubstationUpdate {
  repeated DataPoint points = 1;
}

message ScadaSupervisoryControlRequest {
  // Point identifier
  string key = 1;
  // Command value
  int64 value = 2;
  // Select flag
  bool select = 3;
  // Execute flag
  bool execute = 4;
  // Test flag
  bool test = 5;
  // Client text identifier for logging and debugging
  string client_id = 6;
}

// ProtectionTerminalMode mirrors IEC 61850 Edition 1's Mod/Beh enumeration.
// TEST_BLOCKED (4) is deliberately not modelled by this simulator, so
// values skip from TEST (3) straight to OFF (5).
enum ProtectionTerminalMode {
  MODE_UNKNOWN = 0;
  MODE_ON = 1;
  MODE_BLOCKED = 2;
  MODE_TEST = 3;
  MODE_OFF = 5;
}

message ProtectionTerminalSetModeRequest {
  // Point identifier, "<breaker-name>.mode"
  string key = 1;
  // The mode to set the breaker to
  ProtectionTerminalMode mode = 2;
  // Why the mode is being changed, for logging
  string reason = 3;
  // Client text identifier for logging and debugging
  string client_id = 4;
}

message ProtectionTerminalSetModeResponse {
  ScadaSupervisoryControlResult result = 1;
}